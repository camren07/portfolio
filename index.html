<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille Renou - Portfolio — En développement</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background: #0a0a0a;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, #1e3a8a 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #6d28d9 0%, transparent 30%),
                #0a0a0a;
            z-index: -1;
        }

        .container {
            width: min(90%, 700px);
            padding: 60px 40px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        }

        .badge {
            display: inline-block;
            margin-bottom: 25px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        h1 {
            margin-bottom: 20px;
            font-size: clamp(40px, 8vw, 72px);
            line-height: 1;
            letter-spacing: -3px;
        }

        h1 span {
            color: #8b5cf6;
        }

        p {
            max-width: 520px;
            margin: 0 auto 35px;
            color: #a1a1aa;
            font-size: 17px;
            line-height: 1.7;
        }

        .loader {
            width: 100%;
            height: 5px;
            margin: 0 auto 15px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .loader::before {
            content: "";
            display: block;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            animation: loading 2s ease-in-out infinite;
        }

        .status {
            color: #71717a;
            font-size: 13px;
        }

        .footer {
            margin-top: 40px;
            color: #52525b;
            font-size: 12px;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            50% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(220%);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 45px 25px;
            }

            h1 {
                letter-spacing: -2px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <main class="container">
        <div class="badge">● Portfolio en développement</div>

        <h1>Quelque chose de <span>nouveau</span> arrive.</h1>

        <p>
            Mon portfolio est actuellement en cours de développement.
            Je travaille sur une expérience qui présentera bientôt
            mes projets, mes compétences et mon univers.
        </p>

        <div class="loader"></div>

        <div class="status">
            Construction en cours...
        </div>

        <div class="footer">
            © 2026 — Camille Renou - Mon Portfolio
        </div>
    </main>

</body>
</html>
